             {

             {

                pertanyaan: 'Rina adalah seorang videografer yang ingin menampilkan kesan bahwa seorang tokoh memiliki kekuatan dan dominasi. Ia mengambil gambar dari posisi bawah menghadap ke atas. Sebutkan teknik angle yang digunakan Rina!',

        // ---------- STATE ----------
        let daftarSoal = [];          // soal yang sedang ditampilkan (sudah diacak)
        let timerInterval = null;
        let waktuDetik = 5400;        // 10 menit = 600 detik
        let isTimerRunning = false;
        let isSubmitted = false;

        // Elemen DOM
        const container = document.getElementById('soalContainer');
        const timerDisplay = document.getElementById('timerDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const centangSelesai = document.getElementById('centangSelesai');
        const infoAlert = document.getElementById('infoAlert');
        const acakUlangBtn = document.getElementById('acakUlangBtn');
        const namaInput = document.getElementById('namaSiswa');
        const kelasSelect = document.getElementById('kelasSiswa');

        // ---------- FUNGSI ACUAN ----------
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Acak urutan soal, dan untuk pilihan ganda acak opsi + sesuaikan jawabanBenar
        function generateRandomSoal() {
            // 1. ambil salinan bankSoal
            const shuffledSoal = shuffleArray([...bankSoal]);

            // 2. untuk setiap soal tipe pilihan, acak opsi dan perbarui jawabanBenar
            const processed = shuffledSoal.map(soal => {
                if (soal.tipe === 'pilihan') {
                    const opsiAsli = [...soal.opsi];
                    const jawabanBenarAsli = soal.jawabanBenar;
                    // acak opsi
                    const shuffledOpsi = shuffleArray([...opsiAsli]);
                    // jawabanBenar baru = nilai yang sama (tetapi tetap string)
                    // karena jawabanBenar adalah teks, dan opsi sudah diacak, 
                    // kita cari indeks jawaban benar di opsi asli, lalu ambil dari shuffledOpsi di posisi yang sama? 
                    // Cara lebih aman: jawabanBenar adalah string, tetap sama nilainya.
                    // Tapi karena opsi diacak, jawabanBenar tetap berupa string yang sama (misal "Jakarta")
                    // tidak masalah, karena saat render kita akan tandai radio yang value-nya sama dengan jawabanBenar.
                    return {
                        ...soal,
                        opsi: shuffledOpsi,
                        jawabanBenar: jawabanBenarAsli   // tetap sama
                    };
                } else {
                    return { ...soal };
                }
            });
            return processed;
        }

        // Render soal ke container
        function renderSoal(soalArray) {
            if (!soalArray || soalArray.length === 0) {
                container.innerHTML = '<p style="padding:20px;">Tidak ada soal.</p>';
                return;
            }

            let html = '';
            soalArray.forEach((soal, index) => {
                const nomor = index + 1;
                const tipeLabel = soal.tipe === 'pilihan' ? 'Pilihan Ganda' : 'Jawaban Singkat';

                html += `<div class="soal-item" data-index="${index}">`;
                html += `<div class="soal-header"><span class="nomor">Soal ${nomor}</span><span class="tipe">${tipeLabel}</span></div>`;
                html += `<div class="soal-text">${soal.pertanyaan}</div>`;

                if (soal.tipe === 'pilihan') {
                    html += `<div class="opsi-container">`;
                    // opsi sudah diacak dari generateRandomSoal
                    soal.opsi.forEach((opsiText, idx) => {
                        const radioId = `q${index}_${idx}`;
                        html += `
                            <div class="opsi-item">
                                <input type="radio" name="soal_${index}" value="${opsiText}" id="${radioId}" />
                                <label for="${radioId}">${opsiText}</label>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else {
                    // jawaban singkat
                    html += `
                        <div class="jawaban-singkat">
                            <input type="text" placeholder="Tulis jawaban ..." data-soalindex="${index}" class="input-singkat" />
                        </div>
                    `;
                }
                html += `</div>`;
            });

            container.innerHTML = html;

            // event listener untuk radio & input singkat tidak diperlukan khusus, nanti diambil saat submit
        }

        // Fungsi untuk memuat ulang (acak + render)
        function loadAcakDanRender() {
            if (isSubmitted) {
                alert('Ujian sudah dikumpulkan. Refresh halaman untuk memulai ulang.');
                return;
            }
            // acak soal
            daftarSoal = generateRandomSoal();
            renderSoal(daftarSoal);
            // reset centang
            centangSelesai.checked = false;
            submitBtn.disabled = true;
            // reset alert
            infoAlert.style.display = 'none';
            infoAlert.textContent = '';
            // reset timer jika belum berjalan (atau jalankan)
            if (!isTimerRunning) {
                startTimer();
            }
        }

        // ---------- TIMER ----------
        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if (waktuDetik <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isTimerRunning = false;
                    timerDisplay.textContent = '00:00';
                    alert('⏰ Waktu habis! Silakan kumpulkan.');
                    // otomatis submit? atau biarkan user klik submit dengan centang
                    // kita enable submit jika centang dicentang, tapi tidak otomatis.
                    // Tapi akan kita disable submit? kita biarkan saja.
                    return;
                }
                waktuDetik--;
                const menit = Math.floor(waktuDetik / 60);
                const detik = waktuDetik % 60;
                timerDisplay.textContent = `${String(menit).padStart(2, '0')}:${String(detik).padStart(2, '0')}`;
            }, 1000);
        }

        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            waktuDetik = 5400;
            timerDisplay.textContent = '90:00';
            isTimerRunning = false;
            // start ulang
            startTimer();
        }

        // ---------- SUBMIT ----------
        function handleSubmit() {
            if (isSubmitted) {
                alert('Sudah dikumpulkan.');
                return;
            }

            // validasi identitas
            const nama = namaInput.value.trim();
            if (nama === '') {
                infoAlert.style.display = 'block';
                infoAlert.textContent = '⚠️ Harap isi nama siswa.';
                return;
            }

            // cek centang
            if (!centangSelesai.checked) {
                infoAlert.style.display = 'block';
                infoAlert.textContent = '⚠️ Centang "Saya sudah selesai mengerjakan" terlebih dahulu.';
                return;
            }

            // kumpulkan jawaban
            const jawabanUser = [];
            const soalItems = document.querySelectorAll('.soal-item');
            let semuaTerisi = true;

            soalItems.forEach((item, idx) => {
                const soal = daftarSoal[idx];
                if (soal.tipe === 'pilihan') {
                    const selected = item.querySelector(`input[name="soal_${idx}"]:checked`);
                    if (selected) {
                        jawabanUser.push({ nomor: idx+1, tipe: 'pilihan', jawaban: selected.value });
                    } else {
                        jawabanUser.push({ nomor: idx+1, tipe: 'pilihan', jawaban: '(tidak diisi)' });
                        semuaTerisi = false;
                    }
                } else {
                    const input = item.querySelector('.input-singkat');
                    if (input) {
                        const val = input.value.trim();
                        if (val === '') {
                            jawabanUser.push({ nomor: idx+1, tipe: 'singkat', jawaban: '(tidak diisi)' });
                            semuaTerisi = false;
                        } else {
                            jawabanUser.push({ nomor: idx+1, tipe: 'singkat', jawaban: val });
                        }
                    }
                }
            });

            // Hitung skor (opsional)
            let benar = 0;
            jawabanUser.forEach((jaw, index) => {
                const soal = daftarSoal[index];
                if (jaw.jawaban === soal.jawabanBenar) benar++;
            });

            // Tampilkan hasil (alert)
            const kelas = kelasSelect.value;
            const total = daftarSoal.length;
            let pesan = `📊 Hasil Ujian\nNama: ${nama}\nKelas: ${kelas}\nJawaban benar: ${benar} dari ${total}`;
            if (!semuaTerisi) pesan += '\n⚠️ Ada jawaban kosong.';
            alert(pesan);

            // Nonaktifkan submit & timer
            isSubmitted = true;
            submitBtn.disabled = true;
            centangSelesai.disabled = true;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                isTimerRunning = false;
            }
            infoAlert.style.display = 'block';
            infoAlert.textContent = '✅ Ujian selesai. Jawaban telah dikumpulkan.';
            // disable semua input
            document.querySelectorAll('input, select, button').forEach(el => {
                if (el !== acakUlangBtn) el.disabled = true;
            });
            acakUlangBtn.disabled = true; // tidak bisa acak lagi
        }

        // ---------- EVENT LISTENER ----------
        // centang selesai -> enable submit
        centangSelesai.addEventListener('change', function() {
            if (this.checked && !isSubmitted) {
                submitBtn.disabled = false;
                infoAlert.style.display = 'none';
            } else {
                submitBtn.disabled = true;
            }
        });

        submitBtn.addEventListener('click', handleSubmit);

        acakUlangBtn.addEventListener('click', function() {
            if (isSubmitted) {
                alert('Ujian sudah dikumpulkan. Refresh halaman untuk memulai ulang.');
                return;
            }
            // reset timer?
            // konfirmasi
            if (confirm('Acak ulang soal akan mereset timer ke 10 menit. Lanjutkan?')) {
                resetTimer();
                loadAcakDanRender();
                // reset centang
                centangSelesai.checked = false;
                submitBtn.disabled = true;
                infoAlert.style.display = 'none';
                // enable semua (jika ada yang disable)
                document.querySelectorAll('input, select, button').forEach(el => el.disabled = false);
                centangSelesai.disabled = false;
                isSubmitted = false;
            }
        });

        // Inisialisasi: acak otomatis saat load
        window.addEventListener('load', function() {
            // reset state
            isSubmitted = false;
            centangSelesai.disabled = false;
            submitBtn.disabled = true;
            // load soal acak
            daftarSoal = generateRandomSoal();
            renderSoal(daftarSoal);
            // timer
            resetTimer(); // start 10 menit
            // event untuk input nama/kelas tidak perlu
            infoAlert.style.display = 'none';
        });

        // Jika user memuat ulang halaman, semua state reset.
        // tambahan: jika timer habis, kita tidak matikan fungsi, hanya alert.
        // Biarkan user bisa submit jika centang dicentang.
        // Namun jika waktu habis, timerDisplay 00:00, dan tombol submit tetap bisa diklik jika centang.
        // kita tambahkan cek di handleSubmit jika waktu habis? opsional.

    })();
</script>
